<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <style>
    .tile { opacity: 0; transform: translateY(14px); animation: rise 700ms ease forwards; }
    .t1 { animation-delay: 0ms; } .t2 { animation-delay: 120ms; } .t3 { animation-delay: 240ms; }
    .t4 { animation-delay: 360ms; } .t5 { animation-delay: 480ms; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .ico { transform-origin: center; animation: bob 3.2s ease-in-out infinite; }
    .b2 { animation-delay: .3s; } .b3 { animation-delay: .6s; } .b4 { animation-delay: .9s; } .b5 { animation-delay: 1.2s; }
    @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }
    .cap { fill: #15201a; font-size: 15px; font-weight: 800; text-anchor: middle; }
    .g { fill: #108a00; }
  </style>

  <!-- Tile 1: Candidate profile -->
  <g class="tile t1" transform="translate(40,20)">
    <rect width="150" height="140" rx="14" fill="#ffffff" stroke="#d9e1d9"/>
    <g class="ico" transform="translate(75,58)">
      <circle cx="0" cy="-8" r="14" class="g"/>
      <path d="M-22 26 a22 20 0 0 1 44 0 z" class="g"/>
    </g>
    <text class="cap" x="75" y="118">Candidate</text>
  </g>

  <!-- Tile 2: Jobs feed -->
  <g class="tile t2" transform="translate(210,20)">
    <rect width="150" height="140" rx="14" fill="#ffffff" stroke="#d9e1d9"/>
    <g class="ico b2" transform="translate(75,58)">
      <rect x="-22" y="-10" width="44" height="34" rx="5" class="g"/>
      <rect x="-10" y="-20" width="20" height="12" rx="3" class="g"/>
    </g>
    <text class="cap" x="75" y="118">7 Jobs</text>
  </g>

  <!-- Tile 3: Bid / boost -->
  <g class="tile t3" transform="translate(380,20)">
    <rect width="150" height="140" rx="14" fill="#ffffff" stroke="#d9e1d9"/>
    <g class="ico b3" transform="translate(75,58)">
      <rect x="-24" y="8" width="12" height="16" rx="2" class="g"/>
      <rect x="-6" y="-4" width="12" height="28" rx="2" class="g"/>
      <rect x="12" y="-16" width="12" height="40" rx="2" class="g"/>
    </g>
    <text class="cap" x="75" y="118">Bid &amp; Boost</text>
  </g>

  <!-- Tile 4: Connects meter -->
  <g class="tile t4" transform="translate(550,20)">
    <rect width="150" height="140" rx="14" fill="#ffffff" stroke="#d9e1d9"/>
    <g class="ico b4" transform="translate(75,58)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#dfe8df" stroke-width="6"/>
      <path d="M0 -20 a20 20 0 0 1 17 30" fill="none" stroke="#108a00" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text class="cap" x="75" y="118">75 Connects</text>
  </g>

  <!-- Tile 5: Admin score -->
  <g class="tile t5" transform="translate(720,20)">
    <rect width="150" height="140" rx="14" fill="#ffffff" stroke="#d9e1d9"/>
    <g class="ico b5" transform="translate(75,58)">
      <polygon points="0,-20 6,-6 21,-6 9,3 13,18 0,9 -13,18 -9,3 -21,-6 -6,-6" class="g"/>
    </g>
    <text class="cap" x="75" y="118">Fit Score</text>
  </g>
</svg>
